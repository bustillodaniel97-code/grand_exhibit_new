; Grand Exhibit — Android export preset TEMPLATE.
;
; WHY A TEMPLATE. `export_presets.cfg` is gitignored, and it must stay that way:
; the Godot editor writes keystore paths — and, if someone types them into the
; export dialog, keystore PASSWORDS — straight into that file. Committing it is
; how signing credentials leak. This template is the version-controlled,
; secret-free source of truth; `tools/build_android.sh` materialises
; export_presets.cfg from it at build time and takes the signing identity from
; the environment, so the preset is reproducible and nothing secret is ever
; tracked.
;
; Regenerate with:  tools/build_android.sh --preset-only
;
; DO NOT put a keystore path, alias or password in this file.
;
; SIZE. Every preset leaves out the 2D isometric floor's sprite sheets
; (art/npc_*, art/environment, art/vehicles; about 150 MB). Every museum ships
; the 3D toy floor, and the 2D sprite loaders check for their files and fall
; back to procedural drawing when they are absent.

[preset.0]

name="Android Release"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; Ship no test code, no authoring tools and no design docs inside the bundle.
; tools/ contains screenshot and venue-authoring scripts that pull in editor-only
; assumptions, and docs/ is several hundred KB of Markdown nobody installs.
exclude_filter="tests/*, tools/*, docs/*, *.md, la_style/*, art/npc_motion/*, art/npc_cart_steering/*, art/npc_activities/*, art/npc_seating/*, art/npc_carts/*, art/environment/*, art/vehicles/*"
export_path="build/grand-exhibit.aab"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""

; Gradle build is REQUIRED, not a preference: Play Billing, AdMob and UMP all
; arrive as Godot Android plugins, and plugins are only linked when the project
; builds from the installed Android build template rather than the prebuilt APK.
gradle_build/use_gradle_build=true
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
; 1 = Android App Bundle. Play requires an .aab for new releases.
gradle_build/export_format=1
gradle_build/min_sdk="24"
; Play requires API 36 for submissions on or after 2026-08-31 (handoff §Android).
gradle_build/target_sdk="36"

; 64-bit only. Play has required a 64-bit binary since 2019, and shipping the
; 32-bit slices as well would roughly double the download for hardware this game
; does not target.
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=true

version/code=1
version/name="1.0.0"

; PLACEHOLDER application id — the user must confirm the final one before the
; first upload. Play binds the package name to the listing permanently; it can
; never be changed after the first release, so this is a decision, not a default.
package/unique_name="com.bustillo.grandexhibit"
package/name="Grand Exhibit"
package/signed=true
; 2 = Game. Drives the Android "Games" grouping and Play's category default.
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false

launcher_icons/main_192x192="res://assets/android/icon_192.png"
launcher_icons/adaptive_foreground_432x432="res://assets/android/icon_fg_432.png"
launcher_icons/adaptive_background_432x432="res://assets/android/icon_bg_432.png"

graphics/opengl_debug=false

xr_features/xr_mode=0

; Portrait only, matching project.godot window/handheld/orientation=1. The whole
; UI is authored against a 720x1280 canvas.
screen/immersive_mode=true
screen/support_small=false
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true

; Auto Backup off. The save carries currency and entitlements; letting Android
; restore an old copy onto a new device is a duplication and rollback vector, and
; Play Games / our own restore path is the supported route.
user_data_backup/allow=false

command_line/extra_args=""

apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""

; --- Permissions ------------------------------------------------------------
; Deliberately minimal. Every permission here has to be justified in the Play
; Data Safety form, and anything not listed is one we do not request.
;   internet              — ad fill, billing, consent form
;   access_network_state  — offline detection so a dead network fails fast
; AD_ID is NOT toggled here; it is contributed by the AdMob plugin's manifest and
; must be declared in Data Safety as advertising identifier collection.
permissions/internet=true
permissions/access_network_state=true

; =============================================================================
; DESKTOP + iOS (Steam, Epic Games Store, Microsoft Store, App Store).
; Same rule as Android: no signing identity, certificate, team secret or store
; credential is ever written here. See docs/PLATFORMS.md for the per-store steps.
;
; custom_features select the storefront backend in autoload/platform_services.gd:
;   "steam" -> GodotSteam (Steamworks), "epic" -> EOS, none -> offline stub.
; The Microsoft Store takes the plain Windows build wrapped as MSIX (docs).
; =============================================================================

